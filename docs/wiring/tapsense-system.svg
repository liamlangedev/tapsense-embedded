<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1010" width="1320" height="1010" role="img" aria-label="TapSense system schematic: three FSR dividers into an Arduino Nano, Nano TX through a 1k/2k resistor divider into an ESP8266 access point, with a common ground rail">
<style>
svg{font-family:ui-sans-serif,system-ui,sans-serif}
.box{fill:#16202e;stroke:#7d93ab;stroke-width:2}

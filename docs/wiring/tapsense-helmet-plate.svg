<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" width="1360" height="820" role="img" aria-label="TapSense v2 target architecture: 4-zone directional helmet and plate carrier tap pad">
<style>
svg{font-family:ui-sans-serif,system-ui,sans-serif}
.box{fill:#16202e;stroke:#7d93ab;stroke-width:2}
.card{fill:#131c28;stroke:#4b5f75;stroke-width:2}
.inner{fill:#0d1520;stroke:#3b4c61;stroke-width:1.5;stroke-dasharray:5 4}
.usb{fill:#13251b;stroke:#4f9464;stroke-width:2}
.wire{fill:none;stroke:#38bdf8;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.gnd{fill:none;stroke:#a78bfa;stroke-width:3;stroke-linecap:round}
.res{fill:#1f2f42;stroke:#fbbf24;stroke-width:2}
.arrowhead{fill:#38bdf8;stroke:none}
.node{fill:#38bdf8;stroke:none}
.pinpt{fill:#cbd5e1;stroke:none}
.legendbox{fill:#101824;stroke:#334155;stroke-width:1.5}
.title{fill:#f8fafc;font:700 17px ui-sans-serif,system-ui}
.sub{fill:#94a3b8;font:12.5px ui-sans-serif,system-ui}
.pin{fill:#dbe6f1;font:13px ui-monospace,monospace}
.mono{fill:#cbd5e1;font:12px ui-monospace,monospace}
.monosmall{fill:#7dd3fc;font:11.5px ui-monospace,monospace}
.label{fill:#f1f5f9;font:600 13.5px ui-sans-serif,system-ui}
.plabel{fill:#fcd34d;font:600 12px ui-monospace,monospace}
.netsmall{fill:#7dd3fc;font:11.5px ui-monospace,monospace}
.lgtitle{fill:#f8fafc;font:700 19px ui-sans-serif,system-ui}
</style>
<rect x="0" y="0" width="1360" height="820" fill="#0d1117"/>
<text class="lgtitle" x="52" y="54" text-anchor="start">TapSense v2 — 4-Zone Directional Helmet + Plate Carrier Architecture</text>
<text class="sub" x="52" y="78" text-anchor="start">Target architecture: directional impact vectoring + gesture-triggered drone dispatch</text>
<rect class="card" x="48" y="110" width="275" height="325" rx="14"/>
<text class="title" x="185" y="138" text-anchor="middle">4-Zone Helmet Array</text>
<text class="sub" x="185" y="158" text-anchor="middle">CurveSYS FSR · 10 kΩ divider each</text>
<circle cx="185" cy="272" r="76" fill="#0b121c" stroke="#475569" stroke-width="2.5"/>
<circle cx="185" cy="272" r="30" fill="#16202e" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="monosmall" x="185" y="276" text-anchor="middle">atan2(x,y)</text>
<rect x="163" y="184" width="44" height="24" rx="5" fill="#1f2f42" stroke="#fbbf24" stroke-width="2"/>
<text class="plabel" x="185" y="200" text-anchor="middle">A0</text>
<rect x="239" y="260" width="44" height="24" rx="5" fill="#1f2f42" stroke="#fbbf24" stroke-width="2"/>
<text class="plabel" x="261" y="276" text-anchor="middle">A1</text>
<rect x="163" y="336" width="44" height="24" rx="5" fill="#1f2f42" stroke="#fbbf24" stroke-width="2"/>
<text class="plabel" x="185" y="352" text-anchor="middle">A2</text>
<rect x="87" y="260" width="44" height="24" rx="5" fill="#1f2f42" stroke="#fbbf24" stroke-width="2"/>
<text class="plabel" x="109" y="276" text-anchor="middle">A3</text>
<text class="netsmall" x="185" y="180" text-anchor="middle">Front · H_N (0°)</text>
<text class="netsmall" x="185" y="374" text-anchor="middle">Back · H_S (180°)</text>
<text class="netsmall" x="83" y="276" text-anchor="end">L · W</text>
<text class="netsmall" x="287" y="276" text-anchor="start">R · E</text>
<text class="mono" x="185" y="415" text-anchor="middle">Vector sum: dx = E-W, dy = N-S</text>
<rect class="card" x="48" y="460" width="275" height="185" rx="14"/>
<text class="title" x="185" y="492" text-anchor="middle">Plate Carrier Tap Pad</text>
<text class="sub" x="185" y="514" text-anchor="middle">Chest / shoulder gesture trigger</text>
<rect class="res" x="125" y="534" width="120" height="44" rx="8"/>
<text class="plabel" x="185" y="561" text-anchor="middle">P_TAP → A4</text>
<text class="mono" x="185" y="604" text-anchor="middle">2 taps : critical_situation</text>
<text class="mono" x="185" y="624" text-anchor="middle">3 taps : medical_supply_drone</text>
<rect class="box" x="415" y="165" width="220" height="425" rx="14"/>
<text class="title" x="525.0" y="199" text-anchor="middle">Arduino Nano</text>
<text class="sub" x="525.0" y="221" text-anchor="middle">100 Hz · 5-ch ADC</text>
<circle class="pinpt" cx="415" cy="255" r="4.5"/>
<text class="pin" x="429" y="260" text-anchor="start">A0  H_N</text>
<circle class="pinpt" cx="415" cy="295" r="4.5"/>
<text class="pin" x="429" y="300" text-anchor="start">A1  H_E</text>
<circle class="pinpt" cx="415" cy="335" r="4.5"/>
<text class="pin" x="429" y="340" text-anchor="start">A2  H_S</text>
<circle class="pinpt" cx="415" cy="375" r="4.5"/>
<text class="pin" x="429" y="380" text-anchor="start">A3  H_W</text>
<circle class="pinpt" cx="415" cy="555" r="4.5"/>
<text class="pin" x="429" y="560" text-anchor="start">A4  P_TAP</text>
<path class="wire" d="M323 255 L415 255"/>
<path class="wire" d="M323 295 L415 295"/>
<path class="wire" d="M323 335 L415 335"/>
<path class="wire" d="M323 375 L415 375"/>
<path class="wire" d="M323 555 L415 555"/>
<text class="sub" x="525.0" y="440" text-anchor="middle">CSV @ 115200 baud:</text>
<text class="mono" x="525.0" y="462" text-anchor="middle">H_N:..,H_E:..,H_S:..,</text>
<text class="mono" x="525.0" y="480" text-anchor="middle">H_W:..,P_TAP:..</text>
<circle class="pinpt" cx="635" cy="390" r="4.5"/>
<text class="pin" x="623" y="395" text-anchor="end">D1/TX</text>
<path class="wire" d="M635 390 L665 390"/>
<rect class="res" x="665" y="376" width="48" height="28" rx="4"/>
<text class="plabel" x="689" y="368" text-anchor="middle">1 kΩ</text>
<path class="wire" d="M713 390 L745 390"/>
<circle class="node" cx="727" cy="390" r="4.5"/>
<path class="wire" d="M727 390 L727 455"/>
<rect class="res" x="713" y="455" width="28" height="56" rx="4"/>
<text class="plabel" x="705" y="488" text-anchor="end">2 kΩ</text>
<path class="gnd" d="M727 511 L727 555"/>
<text class="netsmall" x="727" y="574" text-anchor="middle">GND</text>
<rect class="box" x="745" y="175" width="265" height="430" rx="14"/>
<text class="title" x="877.5" y="209" text-anchor="middle">ESP8266 Hub v2</text>
<text class="sub" x="877.5" y="231" text-anchor="middle">AP: FSR-Hub (192.168.4.1)</text>
<circle class="pinpt" cx="745" cy="390" r="4.5"/>
<text class="pin" x="737" y="378" text-anchor="end">D7</text>
<rect class="inner" x="763" y="257" width="229" height="80" rx="8"/>
<text class="label" x="877.5" y="281" text-anchor="middle">Directional Impact Engine</text>
<text class="monosmall" x="877.5" y="301" text-anchor="middle">EMA baseline + vector deg</text>
<text class="monosmall" x="877.5" y="319" text-anchor="middle">severity + confidence</text>
<rect class="inner" x="763" y="353" width="229" height="72" rx="8"/>
<text class="label" x="877.5" y="377" text-anchor="middle">Plate Gesture Classifier</text>
<text class="monosmall" x="877.5" y="397" text-anchor="middle">attaches last helmet impact</text>
<rect class="inner" x="763" y="441" width="229" height="76" rx="8"/>
<text class="label" x="877.5" y="465" text-anchor="middle">16-Event Ring Buffer</text>
<text class="monosmall" x="877.5" y="485" text-anchor="middle">GET /events?since=&lt;id&gt;</text>
<text class="monosmall" x="877.5" y="503" text-anchor="middle">GET /data  |  GET / + OLED</text>
<text class="netsmall" x="877.5" y="570" text-anchor="middle">Store-and-Forward over Wi-Fi</text>
<rect class="usb" x="1095" y="175" width="225" height="195" rx="14"/>
<text class="title" x="1207.5" y="209" text-anchor="middle">Raspberry Pi</text>
<text class="monosmall" x="1207.5" y="231" text-anchor="middle">tapsense_pi_client.py</text>
<text class="mono" x="1207.5" y="271" text-anchor="middle">• polls /events?since=id</text>
<text class="mono" x="1207.5" y="293" text-anchor="middle">• logs JSONL locally</text>
<text class="mono" x="1207.5" y="315" text-anchor="middle">• feeds C2 / dashboard</text>
<text class="mono" x="1207.5" y="337" text-anchor="middle">• triggers drone webhook</text>
<path class="wire" d="M1010 272 L1087 272"/>
<path class="arrowhead" d="M1095 272 l-11 -6 v12 z"/>
<text class="netsmall" x="1052" y="256" text-anchor="middle">Wi-Fi</text>
<rect class="card" x="1095" y="430" width="225" height="175" rx="14"/>
<text class="title" x="1207.5" y="466" text-anchor="middle">Autonomous Drone</text>
<text class="sub" x="1207.5" y="488" text-anchor="middle">Medical Resupply / Medevac</text>
<text class="mono" x="1207.5" y="528" text-anchor="middle">mission_type + GPS</text>
<text class="mono" x="1207.5" y="550" text-anchor="middle">+ helmet_impact:</text>
<text class="monosmall" x="1207.5" y="572" text-anchor="middle">direction_deg, severity</text>
<path class="wire" d="M1207.5 370 L1207.5 422"/>
<path class="arrowhead" d="M1207.5 430 l-6 -11 h12 z"/>
<text class="netsmall" x="1219.5" y="405" text-anchor="start">HTTP POST</text>
<rect class="legendbox" x="48" y="690" width="1272" height="76" rx="10"/>
<text class="label" x="72" y="720" text-anchor="start">How the two subsystems combine:</text>
<text class="sub" x="72" y="745" text-anchor="start">A helmet hit is detected and stored with its impact angle (0–359°). When the operator later taps 3× on the plate carrier, the gesture event automatically attaches that impact vector for medevac / drone triage.</text>
</svg>

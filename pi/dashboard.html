<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Hub — Helmet Edge Live</title>
<style>
:root {
  --bg-0: #05070C;
  --bg-1: #0A0D12;
  --bg-2: #0F131C;
  --bg-3: #161D2B;
  --bg-4: #1E2636;
  --accent: #38BDF8;
  --accent-dim: #1E4D6B;
  --error: #EF4444;
  --warning: #F59E0B;
  --success: #10B981;
  --fg: #E5E7EB;
  --muted: #9CA3AF;
  --border: #374151;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg-0);
  color: var(--fg);
  padding: clamp(1rem, 3vw, 2rem);
}

.header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--border);
}

.title {
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 700;
  letter-spacing: -0.02em;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: var(--bg-2);
  border-radius: 999px;
  font-size: 0.875rem;
  font-weight: 600;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
}

.card-title {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 1rem;
}

.helmet-view {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-width: 300px;
  margin: 0 auto;
}

.helmet-zone {
  position: absolute;
  background: var(--bg-3);
  border: 2px solid var(--border);
  transition: all 0.2s ease;
}

.helmet-zone.hit {
  border-color: var(--error);
  background: var(--error);
  box-shadow: 0 0 40px var(--error);
  animation: hit-flash 0.5s ease-out;
}

@keyframes hit-flash {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.1); opacity: 0.8; }
  100% { transform: scale(1); opacity: 1; }
}

.zone-front {
  top: 0;
  left: 30%;
  width: 40%;
  height: 30%;
  border-radius: 40% 40% 8px 8px;
}

.zone-back {
  bottom: 0;
  left: 30%;
  width: 40%;
  height: 30%;
  border-radius: 8px 8px 40% 40%;
}

.zone-left {
  top: 30%;
  left: 0;
  width: 30%;
  height: 40%;
  border-radius: 40% 8px 8px 40%;
}

.zone-right {
  top: 30%;
  right: 0;
  width: 30%;
  height: 40%;
  border-radius: 8px 40% 40% 8px;
}

.zone-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--muted);
  pointer-events: none;
}

.compass {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: var(--bg-1);
  border: 2px solid var(--accent-dim);
}

.compass-arrow {
  position: absolute;
  top: 10%;
  left: 50%;
  width: 4px;
  height: 40%;
  background: var(--accent);
  transform-origin: bottom center;
  transition: transform 0.3s ease;
  border-radius: 999px 999px 0 0;
  box-shadow: 0 0 20px var(--accent);
}

.compass-center {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
  transform: translate(-50%, -50%);
}

.compass-label {
  position: absolute;
  font-size: 0.625rem;
  font-weight: 700;
  color: var(--muted);
}

.compass-label.n { top: 8px; left: 50%; transform: translateX(-50%); }
.compass-label.e { right: 8px; top: 50%; transform: translateY(-50%); }
.compass-label.s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.compass-label.w { left: 8px; top: 50%; transform: translateY(-50%); }

.event-feed {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  max-height: 500px;
  overflow-y: auto;
}

.event-item {
  background: var(--bg-3);
  border-left: 4px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  animation: slide-in 0.3s ease;
}

@keyframes slide-in {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.event-item.critical { border-left-color: var(--error); }
.event-item.medium { border-left-color: var(--warning); }
.event-item.low { border-left-color: var(--success); }

.event-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.5rem;
}

.event-type {
  font-weight: 600;
  font-size: 0.875rem;
}

.event-meta {
  display: flex;
  gap: 1rem;
  font-size: 0.75rem;
  color: var(--muted);
}

.event-data {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 0.75rem;
  margin-top: 0.75rem;
}

.data-item {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.data-label {
  font-size: 0.625rem;
  color: var(--muted);
  text-transform: uppercase;
}

.data-value {
  font-size: 0.875rem;
  font-weight: 600;
}

.btn {
  padding: 0.5rem 1rem;
  background: var(--bg-4);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--fg);
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

.sig-verified {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.75rem;
  color: var(--success);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: clamp(1.5rem, 3vw, 2rem);
  font-weight: 700;
  color: var(--accent);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 0.25rem;
}
</style>
</head>
<body>

<div class="header">
  <div class="title">🪖 Squad Hub</div>
  <div></div>
  <div class="status">
    <div class="status-dot"></div>
    <span id="statusText">LISTENING</span>
  </div>
</div>

<div class="grid">
  <div class="card">
    <div class="card-title">Helmet View</div>
    <div class="helmet-view">
      <div class="helmet-zone zone-front" data-zone="FRONT">
        <div class="zone-label">FRONT</div>
      </div>
      <div class="helmet-zone zone-back" data-zone="BACK">
        <div class="zone-label">BACK</div>
      </div>
      <div class="helmet-zone zone-left" data-zone="LEFT">
        <div class="zone-label">LEFT</div>
      </div>
      <div class="helmet-zone zone-right" data-zone="RIGHT">
        <div class="zone-label">RIGHT</div>
      </div>
      <div class="compass">
        <div class="compass-arrow" id="compassArrow"></div>
        <div class="compass-center"></div>
        <div class="compass-label n">N</div>
        <div class="compass-label e">E</div>
        <div class="compass-label s">S</div>
        <div class="compass-label w">W</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Live Statistics</div>
    <div class="stat-grid">
      <div class="stat">
        <div class="stat-value" id="totalEvents">0</div>
        <div class="stat-label">Total Events</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="criticalCount">0</div>
        <div class="stat-label">Critical</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="avgConfidence">—</div>
        <div class="stat-label">Avg Confidence</div>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">Event Timeline</div>
  <div class="event-feed" id="eventFeed"></div>
</div>

<script>
const events = [];
let totalEvents = 0;
let criticalCount = 0;
let confidenceSum = 0;

const MOCK_EVENTS = [
  {"soldier_id":"ALPHA","seq":101,"timestamp_ms":482015,"event_type":"KINETIC_HEAVY","severity":"CRITICAL","primary_zone":"FRONT","direction_deg":5,"peak_force":3650,"confidence":0.96,"raw_zones":{"front":3650,"back":40,"left":180,"right":210},"sig":"e7b8c491a03f8d22"},
  {"soldier_id":"ALPHA","seq":102,"timestamp_ms":482250,"event_type":"DOUBLE_TAP","severity":"CRITICAL","primary_zone":"LEFT","direction_deg":280,"peak_force":2980,"confidence":0.91,"raw_zones":{"front":120,"back":90,"left":2980,"right":15},"sig":"3a9f11c7bc01d4e2"},
  {"soldier_id":"BRAVO","seq":54,"timestamp_ms":485120,"event_type":"GLANCING_BLOW","severity":"MEDIUM","primary_zone":"RIGHT","direction_deg":85,"peak_force":890,"confidence":0.48,"raw_zones":{"front":210,"back":30,"left":40,"right":890},"sig":"fa0024bb88e1a903"},
  {"soldier_id":"BRAVO","seq":55,"timestamp_ms":490000,"event_type":"SINGLE_TAP","severity":"LOW","primary_zone":"BACK","direction_deg":175,"peak_force":620,"confidence":0.75,"raw_zones":{"front":10,"back":620,"left":20,"right":15},"sig":"88cd092147beef19"}
];

function processEvent(event) {
  events.unshift(event);
  totalEvents++;
  if (event.severity === 'CRITICAL') criticalCount++;
  confidenceSum += event.confidence;

  // Update stats
  document.getElementById('totalEvents').textContent = totalEvents;
  document.getElementById('criticalCount').textContent = criticalCount;
  document.getElementById('avgConfidence').textContent = 
    (confidenceSum / totalEvents).toFixed(2);

  // Flash helmet zone
  const zone = document.querySelector(`[data-zone="${event.primary_zone}"]`);
  if (zone) {
    zone.classList.add('hit');
    setTimeout(() => zone.classList.remove('hit'), 500);
  }

  // Rotate compass
  document.getElementById('compassArrow').style.transform = 
    `translateX(-50%) rotate(${event.direction_deg}deg)`;

  // Add to feed
  const feed = document.getElementById('eventFeed');
  const item = document.createElement('div');
  item.className = `event-item ${event.severity.toLowerCase()}`;
  item.innerHTML = `
    <div class="event-header">
      <div class="event-type">${event.event_type}</div>
      <div class="event-meta">
        <span>${event.soldier_id}</span>
        <span>SEQ ${event.seq}</span>
        <span class="sig-verified">✓ SIG OK</span>
      </div>
    </div>
    <div class="event-data">
      <div class="data-item">
        <div class="data-label">Zone</div>
        <div class="data-value">${event.primary_zone}</div>
      </div>
      <div class="data-item">
        <div class="data-label">Direction</div>
        <div class="data-value">${event.direction_deg}°</div>
      </div>
      <div class="data-item">
        <div class="data-label">Force</div>
        <div class="data-value">${event.peak_force}</div>
      </div>
      <div class="data-item">
        <div class="data-label">Confidence</div>
        <div class="data-value">${(event.confidence * 100).toFixed(0)}%</div>
      </div>
      <div class="data-item">
        <div class="data-label">Severity</div>
        <div class="data-value">${event.severity}</div>
      </div>
    </div>
    <button class="btn" style="margin-top: 0.75rem">+ Add Witness Note</button>
  `;
  feed.insertBefore(item, feed.firstChild);

  if (events.length > 20) {
    feed.removeChild(feed.lastChild);
    events.pop();
  }
}

// Simulate live stream
let idx = 0;
function simulateStream() {
  if (idx < MOCK_EVENTS.length) {
    processEvent(MOCK_EVENTS[idx]);
    idx++;
    setTimeout(simulateStream, 3000 + Math.random() * 2000);
  }
}

// Start simulation after 1s
setTimeout(simulateStream, 1000);
</script>

</body>
</html>
